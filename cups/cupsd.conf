#
# SheetHappens - cupsd.conf
#
# Managed by the image: the entrypoint copies this file into /etc/cups on
# every start, so edits made through the web UI to *this* file are reset.
# Printer queues (printers.conf, ppd/) are persisted in the cups_data volume.
#

LogLevel warn
MaxLogSize 1m
ErrorPolicy retry-job

# --- Network --------------------------------------------------------------
# Listen on every interface inside the container (Docker bridge `sheet_net`
# plus the host port mapping 631:631 used for local administration).
Listen 0.0.0.0:631
Listen /run/cups/cups.sock

# Accept any Host header (container name `cups`, host IP, localhost, ...).
ServerAlias *

# No Bonjour/DNS-SD broadcasting from inside the container.
Browsing No
BrowseLocalProtocols none

# --- Web interface & authentication ---------------------------------------
WebInterface Yes
DefaultAuthType Basic
# HTTPS is available on the same port with an auto-generated self-signed
# certificate (https://<HOST-IP>:631). Plain HTTP stays allowed for the
# internal print-api -> cups IPP traffic on the Docker bridge.
DefaultEncryption IfRequested

# Reject jobs larger than 64 MiB (defense in depth; print-api enforces
# MAX_UPLOAD_MB first).
MaxRequestSize 64m
PreserveJobHistory Off
PreserveJobFiles No
MaxJobs 200

# --- Access control -------------------------------------------------------
# Allowed sources: loopback, the container's own subnets (@LOCAL) and the
# RFC1918 private ranges (Docker bridges + home/office LAN). CUPS is NEVER
# exposed through the Cloudflare tunnel; only the Go print-api is.
<Location />
  Order allow,deny
  Allow from 127.0.0.1
  Allow from @LOCAL
  Allow from 10.0.0.0/8
  Allow from 172.16.0.0/12
  Allow from 192.168.0.0/16
</Location>

# Printer/queue administration: requires a user of the SystemGroup (lpadmin),
# provisioned by entrypoint.sh from CUPS_ADMIN_USER / CUPS_ADMIN_PASSWORD.
<Location /admin>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow from 127.0.0.1
  Allow from @LOCAL
  Allow from 10.0.0.0/8
  Allow from 172.16.0.0/12
  Allow from 192.168.0.0/16
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow from 127.0.0.1
  Allow from @LOCAL
  Allow from 10.0.0.0/8
  Allow from 172.16.0.0/12
  Allow from 192.168.0.0/16
</Location>

<Location /admin/log>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow from 127.0.0.1
  Allow from @LOCAL
  Allow from 10.0.0.0/8
  Allow from 172.16.0.0/12
  Allow from 192.168.0.0/16
</Location>

# --- Operation policies ---------------------------------------------------
<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  # Job submission from print-api (anonymous within the allowed networks).
  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  # Users may manage only their own jobs; admins may manage all.
  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  # Queue/printer administration.
  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Cancel-Job CUPS-Authenticate-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  # Read-only operations (lpstat, printer discovery) are open.
  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
