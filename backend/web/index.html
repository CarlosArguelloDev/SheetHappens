<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SheetHappens — Web Print Portal</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg-card: #131b31;
      --bg-elevated: #192340;
      --bg-input: #0e1528;
      --border: #263356;
      --border-focus: #4f8cff;
      --text: #eef2ff;
      --text-muted: #9aa7c7;
      --accent: #4f8cff;
      --accent-hover: #3b78f0;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.12);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.12);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.14);
      --radius: 14px;
      --shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: radial-gradient(circle at top right, #1b2850 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      padding: 24px 16px 48px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    header.topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      padding: 16px 20px;
      background: rgba(19, 27, 49, 0.85);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #7c5cff);
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 6px 18px rgba(79, 140, 255, 0.35);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .health-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .health-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning);
    }

    .health-pill.online .health-dot {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .health-pill.offline .health-dot {
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    .lang-toggle {
      display: inline-flex;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .lang-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .section {
      margin-bottom: 22px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 8px;
    }

    label.field-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .printer-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    select,
    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 11px 13px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.94rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    select:focus,
    input[type="number"]:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.2);
    }

    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 14px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn-icon:hover:not(:disabled) {
      background: #233158;
      border-color: var(--border-focus);
    }

    .btn-icon:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .printer-meta {
      margin-top: 8px;
      font-size: 0.81rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .state-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .state-idle {
      background: var(--success-bg);
      color: var(--success);
    }

    .state-processing {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .state-stopped {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .dropzone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      background: rgba(14, 21, 40, 0.65);
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.18s ease, background 0.18s ease, transform 0.12s ease;
    }

    .dropzone:hover,
    .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(79, 140, 255, 0.08);
    }

    .dropzone-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .dropzone-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .dropzone-hint {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .file-card {
      margin-top: 12px;
      padding: 12px 14px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .file-card[hidden] {
      display: none;
    }

    .file-info {
      min-width: 0;
    }

    .file-name {
      font-weight: 600;
      font-size: 0.92rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-details {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .btn-clear:hover {
      color: var(--danger);
      border-color: var(--danger);
    }

    .grid-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    @media (max-width: 600px) {
      .grid-options {
        grid-template-columns: 1fr;
      }
      header.topbar {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    .range-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-wrap {
      margin-bottom: 16px;
    }

    .progress-wrap[hidden] {
      display: none;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--bg-input);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #22c55e);
      transition: width 0.15s ease;
    }

    .alert-banner {
      padding: 13px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      margin-bottom: 16px;
      border: 1px solid transparent;
    }

    .alert-banner[hidden] {
      display: none;
    }

    .alert-banner.success {
      background: var(--success-bg);
      border-color: rgba(34, 197, 94, 0.35);
      color: #86efac;
    }

    .alert-banner.error {
      background: var(--danger-bg);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .alert-banner.warning {
      background: var(--warning-bg);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fcd34d;
    }

    .btn-submit {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(79, 140, 255, 0.32);
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">🖨️</div>
        <div>
          <div class="brand-title">SheetHappens</div>
          <div class="brand-subtitle" id="brandSubtitle" data-i18n="brand_subtitle">Universal CUPS Web Print Portal</div>
        </div>
      </div>

      <div class="topbar-actions">
        <div class="health-pill" id="healthPill" data-i18n-title="health_tooltip" title="CUPS Server Status">
          <span class="health-dot"></span>
          <span id="healthText" data-i18n="health_checking">Checking CUPS…</span>
        </div>

        <div class="lang-toggle" role="group" data-i18n-aria="lang_aria" aria-label="Switch language">
          <button type="button" class="lang-btn active" data-lang-btn="en" aria-pressed="true">EN</button>
          <button type="button" class="lang-btn" data-lang-btn="es" aria-pressed="false">ES</button>
        </div>
      </div>
    </header>

    <main class="card">
      <div id="alertBanner" class="alert-banner" role="alert" hidden></div>

      <form id="printForm" novalidate>
        <!-- Printer selector -->
        <div class="section">
          <div class="section-header">
            <label class="field-label" for="printerSelect" id="labelPrinter" data-i18n="label_printer">Target Printer</label>
          </div>
          <div class="printer-row">
            <select id="printerSelect" name="printer" required data-i18n-aria="label_printer" aria-label="Target Printer">
              <option value="" data-i18n="printer_loading">Loading printers…</option>
            </select>
            <button type="button" class="btn-icon" id="refreshPrintersBtn" data-i18n-title="refresh_tooltip" title="Refresh printers list">
              ↻ <span id="refreshBtnText" data-i18n="refresh_btn">Refresh</span>
            </button>
          </div>
          <div class="printer-meta" id="printerMeta"></div>
        </div>

        <!-- File upload dropzone -->
        <div class="section">
          <label class="field-label" id="labelDocument" data-i18n="label_document">Document</label>
          <div class="dropzone" id="dropzone" tabindex="0" role="button" data-i18n-aria="dropzone_aria" aria-label="Upload document">
            <div class="dropzone-icon" aria-hidden="true">📄</div>
            <div class="dropzone-title" id="dropzoneTitle" data-i18n="dropzone_title">Drag &amp; drop your file here, or click to browse</div>
            <div class="dropzone-hint" id="dropzoneHint" data-i18n="dropzone_hint">Allowed: PDF, PNG, JPEG, TXT (up to 20 MB)</div>
            <input type="file" id="fileInput" name="file" accept=".pdf,.png,.jpg,.jpeg,.txt,application/pdf,image/png,image/jpeg,text/plain" hidden />
          </div>

          <div class="file-card" id="fileCard" hidden>
            <div class="file-info">
              <div class="file-name" id="fileName"></div>
              <div class="file-details" id="fileDetails"></div>
            </div>
            <button type="button" class="btn-clear" id="clearFileBtn" data-i18n="btn_remove_file">Remove</button>
          </div>
        </div>

        <!-- Print settings -->
        <div class="grid-options">
          <div>
            <label class="field-label" for="copiesInput" id="labelCopies" data-i18n="label_copies">Copies</label>
            <input type="number" id="copiesInput" name="copies" min="1" max="99" value="1" required />
          </div>

          <div>
            <label class="field-label" for="colorSelect" id="labelColor" data-i18n="label_color">Color Mode</label>
            <select id="colorSelect" name="color_mode">
              <option value="color" id="optColor" data-i18n="opt_color">Color</option>
              <option value="monochrome" id="optMono" data-i18n="opt_mono">Grayscale / Monochrome</option>
            </select>
          </div>

          <div class="range-group">
            <label class="field-label" for="pageRangeMode" id="labelPageRange" data-i18n="label_page_range">Page Range</label>
            <select id="pageRangeMode">
              <option value="all" id="optPagesAll" data-i18n="opt_pages_all">All Pages</option>
              <option value="custom" id="optPagesCustom" data-i18n="opt_pages_custom">Custom Range</option>
            </select>
            <input type="text" id="pageRangeInput" name="page_range" data-i18n-placeholder="placeholder_page_range" placeholder="e.g. 1-3, 5, 8-10" hidden />
          </div>

          <div>
            <label class="field-label" for="sidesSelect" id="labelSides" data-i18n="label_sides">Duplex / Sides</label>
            <select id="sidesSelect" name="sides">
              <option value="one-sided" id="optOneSided" data-i18n="opt_one_sided">One-Sided</option>
              <option value="two-sided-long-edge" id="optDuplexLong" data-i18n="opt_duplex_long">Two-Sided (Long Edge)</option>
              <option value="two-sided-short-edge" id="optDuplexShort" data-i18n="opt_duplex_short">Two-Sided (Short Edge)</option>
            </select>
          </div>

          <div>
            <label class="field-label" for="orientationSelect" id="labelOrientation" data-i18n="label_orientation">Orientation</label>
            <select id="orientationSelect" name="orientation">
              <option value="portrait" id="optPortrait" data-i18n="opt_portrait">Portrait</option>
              <option value="landscape" id="optLandscape" data-i18n="opt_landscape">Landscape</option>
            </select>
          </div>
        </div>

        <!-- Upload progress -->
        <div class="progress-wrap" id="progressWrap" hidden>
          <div class="progress-header">
            <span id="progressLabel" data-i18n="progress_uploading">Uploading &amp; spooling…</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-bar" id="progressBar"></div>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn" data-i18n="btn_submit">Print Document</button>
      </form>
    </main>

    <footer id="footerNote" data-i18n="footer_note">
      SheetHappens • Powered by CUPS &amp; Go • Multi-Printer Architecture
    </footer>
  </div>

  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
